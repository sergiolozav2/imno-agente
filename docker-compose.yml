# Pinned local Evolution API stack for WhatsApp development.
# Only the ports needed locally are exposed. Persistent data lives in named
# volumes so `stack:down` does not lose state (use `stack:reset` to wipe).
services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: imno-evolution-api
    restart: unless-stopped
    ports:
      - '8081:8080'
    # On Linux `host.docker.internal` is not resolvable by default (unlike
    # Docker Desktop). This maps it to the host gateway so the container can
    # reach host services like the API webhook at
    # http://host.docker.internal:3001.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - SERVER_URL=http://localhost:8081
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-replace-with-local-evolution-key}
      - AUTHENTICATION_TYPE=apikey
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@evolution-postgres:5432/evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      - LOG_LEVEL=ERROR
      # Disable LID mode - use real phone numbers
      - WPP_LID_MODE=false
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'sh', '-c', 'wget -qO- http://localhost:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  evolution-postgres:
    image: postgres:16.4-alpine
    container_name: imno-evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution']
      interval: 10s
      timeout: 5s
      retries: 12

  evolution-redis:
    image: redis:7.4-alpine
    container_name: imno-evolution-redis
    restart: unless-stopped
    volumes:
      - evolution-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  evolution-postgres-data:
  evolution-redis-data:
